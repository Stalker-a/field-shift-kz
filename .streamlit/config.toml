[theme]
base = "dark"
primaryColor = "#199e70"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"

[theme.sidebar]
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"

[client]
# The charts are drawn for the dark theme, so the menu with the theme switch is hidden.
toolbarMode = "minimal"
